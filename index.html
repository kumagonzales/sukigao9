function avatar(idol){return `<div class="avatar" style="background:linear-gradient(145deg,${idol.color},#fff0f6)">${idol.name.slice(-2)}</div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1300)}
function confetti(){const c=document.getElementById("confetti");c.innerHTML="";for(let i=0;i<70;i++){const s=document.createElement("span");s.style.left=Math.random()*100+"%";s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*.5+"s";s.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(s)}setTimeout(()=>c.innerHTML="",1800)}

function shell(body){return `<div class="page"><div class="content">${body}</div></div>`}
function topbar(phase,label,progress,back=true){return `<div class="topbar">${back?'<button class="back" onclick="goHome()">← トップへ</button>':'<div></div>'}<div class="phase">${phase} ${label}</div></div><div class="progress"><i style="width:${progress}%"></i></div>`}
function render(){
 const app=document.getElementById("app");
 if(state.phase==="home") app.innerHTML=home();
 if(state.phase==="qualifying") app.innerHTML=qualifying();
 if(state.phase==="battle") app.innerHTML=battle();
 if(state.phase==="final") app.innerHTML=finalScreen();
 if(state.phase==="result") app.innerHTML=resultScreen();
}
function home(){
 const resume=state.phase!=="home";
 return shell(`<div class="logo">SUKIGAO 9</div><div class="hero"><div class="heart">💗</div><div class="eyebrow">FEMALE IDOL EDITION</div><h1>女性アイドル<br><span>好き顔9選</span></h1><div class="catch">推しじゃなくて、顔だけで直感勝負！</div><p class="lead">たくさんの候補から「顔が好き！」を<br>直感で選んで、あなたのTOP9を決めよう。</p><button class="primary" onclick="startGame()">好き顔9選をはじめる</button><div class="mini">約3〜5分｜ログイン不要｜途中経過は自動保存</div><div class="notice">現在は動作確認用のサンプル候補者データを使用しています。<br>実際のアイドル名・写真は、権利を確認した画像とデータに差し替えてください。</div></div>`)
}
function startGame(){state={phase:"qualifying",selected:[],qualified:[],ratings:{},comparisons:[],qRound:0,battleIndex:0,finalists:[],result:[]};save();render()}
function goHome(){if(confirm("トップへ戻ります。現在の進行状況は保存されています。")){state.phase="home";save();render()}}
function qualifying(){
 if(!state.qPool){state.qPool=shuffle(idols.map(x=>x.id)).slice(0,60);state.qRound=0;state.selected=[]}
 const total=Math.ceil(state.qPool.length/4), start=state.qRound*4, ids=state.qPool.slice(start,start+4);
 if(ids.length===0){return qualifyingDone()}
 const cards=ids.map(id=>{const x=getIdol(id),sel=state.selected.includes(id);return `<button class="idol-card ${sel?"selected":""}" onclick="toggleSelect('${id}')"><span class="check">✓</span><div class="photo">${avatar(x)}</div><div class="info"><div class="name">${x.name}</div><div class="group">${x.group}</div></div></button>`}).join("");
 return shell(`${topbar("🌱 予選",`${state.qRound+1} / ${total}`,((state.qRound+1)/total)*100)}<div class="question"><h2>この中で好きな顔を選んでね</h2><p>複数OK。深く考えず、直感でどうぞ💗</p></div><div class="grid">${cards}</div><div class="count">選択中 ${state.selected.length} / 3</div><div class="actions"><button class="secondary" onclick="prevQual()">← 戻る</button><button class="primary" onclick="nextQual()">次へ →</button></div>`)
}
function toggleSelect(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<3)state.selected.push(id);else toast("最大3人まで選べます");save();render()}
function prevQual(){if(state.qRound===0){goHome();return}state.qRound--;state.selected=[];save();render()}
function nextQual(){
 state.qualified.push(...state.selected);
 state.selected=[];state.qRound++;
 const total=Math.ceil(state.qPool.length/4);
 if(state.qRound>=total){state.qualified=[...new Set(state.qualified)];state.phase="battle";state.battlePool=shuffle(state.qualified);state.battleIndex=0;state.ratings={};state.battlePairs=[];save();render();return}
 save();render()
}
function qualifyingDone(){state.phase="battle";save();return battleIntro()}
function battleIntro(){return shell(`${topbar("🔥 本選","START",100)}<div class="result-title"><div class="crown">🔥</div><h1>本選スタート</h1><p>予選通過者を1対1で比べます。<br>どっちの顔が好き？を直感で選んでください。</p></div><button class="primary" onclick="beginBattle()">本選をはじめる</button><div class="notice">選択結果からスコアを更新し、後半ほど近い候補同士を比較します。</div>`)}

function ensurePairs(){
 if(!state.battlePool) state.battlePool=shuffle(state.qualified);
 if(!state.ratings)state.ratings={};
 state.battlePool.forEach(id=>{if(state.ratings[id]==null)state.ratings[id]=1000});
 if(!state.battlePairs){
   let arr=[...state.battlePool];
   for(let r=0;r<3;r++){
     arr=shuffle(arr);
     for(let i=0;i+1<arr.length;i+=2)state.battlePairs.push([arr[i],arr[i+1]]);
   }
 }
}
function beginBattle(){state.phase="battle";state.battleIntroDone=true;state.battleIndex=0;state.battlePairs=[];ensurePairs();save();render()}
function battle(){
 if(!state.battleIntroDone)return battleIntro();
 ensurePairs();
 if(state.battleIndex>=state.battlePairs.length){state.phase="final";state.finalists=rankedIds().slice(0,18);state.finalIndex=0;save();render();return finalScreen()}
 const [a,b]=state.battlePairs[state.battleIndex],A=getIdol(a),B=getIdol(b);
 return shell(`${topbar("🔥 本選",`${Math.floor(state.battleIndex/Math.max(1,Math.ceil(state.battlePairs.length/3)))+1} / 3`,(state.battleIndex/state.battlePairs.length)*100)}<div class="question"><h2>どっちの顔が好き？</h2><p>直感で1人をタップ</p></div><div class="battle-grid"><button class="battle-card" onclick="chooseBattle('${a}','${b}')"><div class="photo">${avatar(A)}</div><div class="info"><div class="name">${A.name}</div><div class="group">${A.group}</div></div></button><button class="battle-card" onclick="chooseBattle('${b}','${a}')"><div class="photo">${avatar(B)}</div><div class="info"><div class="name">${B.name}</div><div class="group">${B.group}</div></div></button></div><div class="mini">${state.battleIndex+1} / ${state.battlePairs.length}</div>`)
}
function chooseBattle(w,l){state.ratings[w]+=20;state.ratings[l]-=20;state.comparisons.push([w,l]);state.battleIndex++;save();render()}
function rankedIds(){return Object.keys(state.ratings).sort((a,b)=>state.ratings[b]-state.ratings[a])}

function finalScreen(){
 if(!state.finalists||!state.finalists.length){state.finalists=rankedIds().slice(0,18)}
 if(!state.finalStarted)return shell(`${topbar("👑 決勝","FINAL",100)}<div class="result-title"><div class="crown">👑</div><h1>決勝進出18人決定！</h1><p>ここからは完全二択。<br>あなたの好き顔TOP9を決めます。</p></div><button class="primary" onclick="startFinal()">👑 決勝へ</button><div class="notice">1タップで自動的に次へ進みます。TOP9が確定したら終了します。</div>`);
 if(!state.finalQueue)state.finalQueue=makeFinalQueue();
 if(state.finalIndex>=state.finalQueue.length){finishFinal();return resultScreen()}
 const [a,b]=state.finalQueue[state.finalIndex],A=getIdol(a),B=getIdol(b);
 return shell(`${topbar("👑 決勝","TOP9選考中",Math.min(99,state.finalIndex/state.finalQueue.length*100))}<div class="question"><h2>どっちの顔が好き？</h2><p>迷ったら直感で1人をタップ</p></div><div class="battle-grid"><button class="battle-card" onclick="chooseFinal('${a}','${b}')"><div class="photo">${avatar(A)}</div><div class="info"><div class="name">${A.name}</div><div class="group">${A.group}</div></div></button><button class="battle-card" onclick="chooseFinal('${b}','${a}')"><div class="photo">${avatar(B)}</div><div class="info"><div class="name">${B.name}</div><div class="group">${B.group}</div></div></button></div><div class="mini">TOP9選考中｜${state.finalIndex+1}問目</div>`)
}
function startFinal(){state.finalStarted=true;state.finalIndex=0;state.finalQueue=makeFinalQueue();save();render()}
function makeFinalQueue(){
 const arr=shuffle([...state.finalists]);const q=[];
 for(let i=0;i<arr.length-1;i++)q.push([arr[i],arr[i+1]]);
 for(let i=0;i<Math.min(12,arr.length);i++)q.push([arr[i],arr[(i+3)%arr.length]]);
 return q;
}
function chooseFinal(w,l){state.ratings[w]+=25;state.ratings[l]-=25;state.comparisons.push([w,l]);state.finalIndex++;if(state.finalIndex>=state.finalQueue.length)finishFinal();else{save();render()}}
function finishFinal(){state.result=rankedIds().slice(0,9);state.phase="result";save();confetti();render()}

function resultScreen(){
 const cards=state.result.map((id,i)=>{const x=getIdol(id);return `<div class="result-card"><div class="photo">${avatar(x)}</div><div class="meta"><div class="rank">${i+1}位</div><div class="name">${x.name}</div><div class="group">${x.group}</div></div></div>`}).join("");
 return shell(`<div class="logo">SUKIGAO 9</div><div class="result-title"><div class="crown">👑</div><h1>あなたの好き顔9選</h1><p>あなたの「顔が好き」TOP9</p></div><div class="result-grid">${cards}</div><div class="result-actions"><button class="primary" onclick="shareResult()">𝕏 結果をシェア</button><button class="secondary" onclick="copyResult()">結果テキストをコピー</button><button class="secondary" onclick="saveResultImage()">画像として保存</button><button class="secondary" onclick="reset()">もう一度やる</button></div><div class="note"><b>サンプルデータについて</b><br>現在は動作確認用の候補者データです。実際に公開する際は、使用許諾を得たアイドル名・画像へ差し替えてください。</div>`)
}
function resultText(){return "私の女性アイドル好き顔9選👑\\n\\n"+state.result.map((id,i)=>`${i+1}位 ${getIdol(id).name}`).join("\\n")+"\\n\\n#女性アイドル好き顔9選"}
async function copyResult(){try{await navigator.clipboard.writeText(resultText());toast("結果をコピーしました")}catch(e){toast("コピーできませんでした")}}
function shareResult(){const text=encodeURIComponent(resultText());window.open("https://twitter.com/intent/tweet?text="+text,"_blank","noopener")}
function saveResultImage(){
 const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=1080;canvas.height=1350;
 const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#fff4f8");g.addColorStop(1,"#ffffff");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);
 ctx.fillStyle="#ff5c9a";ctx.font="bold 32px sans-serif";ctx.textAlign="center";ctx.fillText("FEMALE IDOL • SUKIGAO 9",540,70);
 ctx.fillStyle="#332b30";ctx.font="900 58px sans-serif";ctx.fillText("あなたの好き顔9選",540,145);
 ctx.font="bold 25px sans-serif";ctx.fillStyle="#8c7e86";ctx.fillText("顔だけで直感勝負。あなたのTOP9",540,190);
 state.result.forEach((id,i)=>{const x=getIdol(id),col=i%3,row=Math.floor(i/3),px=45+col*335,py=235+row*330;ctx.fillStyle="#fff";roundRect(ctx,px,py,300,285,24);ctx.fillStyle=x.color;roundRect(ctx,px,py,300,230,24);ctx.fillStyle="#fff";ctx.font="900 54px sans-serif";ctx.fillText(x.name.slice(-2),px+150,py+135);ctx.fillStyle="#ff5c9a";ctx.textAlign="left";ctx.font="900 22px sans-serif";ctx.fillText(`${i+1}位`,px+18,py+258);ctx.fillStyle="#332b30";ctx.font="900 24px sans-serif";ctx.fillText(x.name,px+18,py+282);ctx.textAlign="center"});
 ctx.fillStyle="#8c7e86";ctx.font="18px sans-serif";ctx.fillText("#女性アイドル好き顔9選",540,1310);
 const a=document.createElement("a");a.download="female-idol-sukigao9.png";a.href=canvas.toDataURL("image/png");a.click();toast("結果画像を保存しました")
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function final(){return finalScreen()}
function route(){if(state.phase==="battle"&&!state.battleIntroDone)return battleIntro();render()}
render();
</script>
</body>
</html>
